name: Pull request build validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '_builder/**'
      - 'style.css'
      - 'theme.css'
      - 'design-system.css'
      - 'script.js'
      - 'ui.js'
      - '.github/workflows/pr-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile builder
        run: python3 -m py_compile _builder/build.py
      - name: Generate website
        run: python3 _builder/build.py
      - name: Validate generated English and Tamil pages
        run: |
          test -s index.html
          test -s ta/index.html
          test -f design-system.css
          grep -Fq 'href="design-system.css"' index.html
          grep -Fq 'href="../design-system.css"' ta/index.html
          grep -Fq 'id="mainNav"' index.html
          grep -Fq 'id="mainNav"' ta/index.html
