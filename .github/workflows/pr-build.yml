name: Pull request build validation

on:
  pull_request:
    branches:
      - main
    paths:
      - '_builder/**'
      - 'style.css'
      - 'theme.css'
      - 'design-system.css'
      - 'site-quality-fix.css'
      - 'homepage-redesign.css'
      - 'script.js'
      - 'ui.js'
      - '.github/workflows/pr-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Compile builder
        run: python3 -m py_compile _builder/build.py
      - name: Generate website
        run: python3 _builder/build.py
      - name: Normalize shared stylesheet versions on every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              source = re.sub(
                  r'(<link rel="stylesheet" href="[^"]*homepage-redesign\.css)(?:\?[^"]*)?">',
                  r'\1?v=24">',
                  source,
              )
              quality_href = Path(os.path.relpath("site-quality-fix.css", path.parent)).as_posix()
              source = re.sub(
                  r'<link rel="stylesheet" href="[^"]*site-quality-fix\.css(?:\?[^"]*)?">',
                  "",
                  source,
              )
              source = source.replace(
                  "</head>",
                  f'<link rel="stylesheet" href="{quality_href}?v=3"></head>',
                  1,
              )
              if "site-quality-fix.css?v=3" not in source:
                  raise SystemExit(f"Recovery stylesheet missing from {path}")
              path.write_text(source, encoding="utf-8")
          PY
      - name: Validate generated English and Tamil pages
        run: |
          test -s index.html
          test -s ta/index.html
          test -f design-system.css
          test -f site-quality-fix.css
          grep -Fq 'href="design-system.css"' index.html
          grep -Fq 'href="homepage-redesign.css?v=24"' index.html
          grep -Fq 'href="site-quality-fix.css?v=3"' index.html
          grep -Fq 'href="../design-system.css"' ta/index.html
          grep -Fq 'href="../homepage-redesign.css?v=24"' ta/index.html
          grep -Fq 'href="../site-quality-fix.css?v=3"' ta/index.html
          grep -Fq 'id="mainNav"' index.html
          grep -Fq 'id="mainNav"' ta/index.html
