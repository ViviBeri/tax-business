name: Deployed browser visual audit

on:
  push:
    branches:
      - main
      - redesign
    paths:
      - "scripts/browser_audit.py"
      - "styles/**"
      - "site-quality-fix.css"
      - "homepage-redesign.css"
      - "_builder/**"
      - ".github/workflows/browser-visual-audit.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read

concurrency:
  group: deployed-browser-audit
  cancel-in-progress: true

jobs:
  browser-audit:
    name: Desktop and mobile browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --only-binary=:all: "playwright==1.65.0" "greenlet==3.5.6"
          python -m playwright install --with-deps chromium
      - name: Capture deployed site and check browser health
        run: python scripts/browser_audit.py
      - name: Upload desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kvb-browser-audit
          path: browser-audit/
          if-no-files-found: warn
          retention-days: 14
