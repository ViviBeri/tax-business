name: Build site

on:
  push:
    branches:
      - main
    paths:
      - '_builder/**'
      - 'theme.css'
      - 'ui.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 _builder/build.py
      - run: |
          git config user.name kvb-builder-bot
          git config user.email kvb-builder-bot@users.noreply.github.com
          git add -A
          git commit -m "Auto-build: regenerate site [skip ci]" || echo "nothing to commit"
          git push
