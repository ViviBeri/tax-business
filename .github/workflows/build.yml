name: Build site

on:
  push:
    branches:
      - main
    paths:
      - '_builder/**'
      - 'theme.css'
      - 'script.js'
      - 'ui.js'
      - 'index.html'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate site
        run: python3 _builder/build.py
      - name: Apply shared header stylesheet to generated pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              source = re.sub(
                  r'(<link rel="stylesheet" href="[^"]*theme\.css)(?:\?[^"]*)?">',
                  r'\1?v=header-balance-2">',
                  source,
              )
              if 'glass-refinement-v2.css' not in source:
                  source = re.sub(
                      r'(<link rel="stylesheet" href="([^"]*?)design-system\.css">)',
                      lambda match: match.group(1)
                          + f'<link rel="stylesheet" href="{match.group(2)}glass-refinement-v2.css?v=2">',
                      source,
                  )
              path.write_text(source, encoding='utf-8')
          PY
      - name: Commit generated site
        run: |
          git config user.name kvb-builder-bot
          git config user.email kvb-builder-bot@users.noreply.github.com
          git add -A
          git commit -m "Auto-build: regenerate site [skip ci]" || echo "nothing to commit"
          git pull --rebase origin main
          git push
