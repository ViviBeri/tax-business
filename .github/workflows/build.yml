name: Build site

on:
  push:
    branches:
      - main
      - redesign
    paths:
      - '_builder/**'
      - 'theme.css'
      - 'script.js'
      - 'index.html'
      - 'style.css'
      - 'homepage-redesign.css'
      - 'styles/**'
      - 'scripts/**'
      - 'site-quality-fix.css'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Sync branch before generating
        run: git pull --rebase origin "$GITHUB_REF_NAME"
      - name: Generate site
        run: python3 _builder/build.py
      - name: Normalize shared stylesheet versions on every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              source = path.read_text(encoding='utf-8')
              source = re.sub(
                  r'<link rel="stylesheet" href="[^"]*glass-refinement-v2\.css(?:\?[^"]*)?">',
                  "",
                  source,
              )
              source = re.sub(
                  r'<link rel="stylesheet" href="[^"]*SplitFlapText\.css(?:\?[^"]*)?">',
                  "",
                  source,
              )
              source = re.sub(
                  r'<script src="[^"]*(?:ui|SplitFlapText)\.js(?:\?[^"]*)?" defer></script>',
                  "",
                  source,
              )
              source = re.sub(
                  r'(<link rel="stylesheet" href="[^"]*theme\.css)(?:\?[^"]*)?">',
                  r'\1?v=header-balance-2">',
                  source,
              )
              source = re.sub(
                  r'(<link rel="stylesheet" href="[^"]*homepage-redesign\.css)(?:\?[^"]*)?">',
                  r'\1?v=25">',
                  source,
              )
              quality_href = Path(os.path.relpath("site-quality-fix.css", path.parent)).as_posix()
              taste_href = Path(os.path.relpath("styles/taste-direction.css", path.parent)).as_posix()
              premium_href = Path(os.path.relpath("styles/kvb-premium-pass.css", path.parent)).as_posix()
              source = re.sub(
                  r'<link rel="stylesheet" href="[^"]*site-quality-fix\.css(?:\?[^"]*)?">',
                  "",
                  source,
              )
              source = re.sub(
                  r'<link rel="stylesheet" href="[^"]*taste-direction\.css(?:\?[^"]*)?">',
                  "",
                  source,
              )
              source = re.sub(
                  r'<link rel="stylesheet" href="[^"]*kvb-premium-pass\.css(?:\?[^"]*)?">',
                  "",
                  source,
              )
              source = source.replace(
                  "</head>",
                  f'<link rel="stylesheet" href="{quality_href}?v=5">'
                  f'<link rel="stylesheet" href="{taste_href}?v=2">'
                  f'<link rel="stylesheet" href="{premium_href}?v=5"></head>',
                  1,
              )
              if ("site-quality-fix.css?v=5" not in source
                      or "taste-direction.css?v=2" not in source
                      or "kvb-premium-pass.css?v=5" not in source):
                  raise SystemExit(f"Required visual stylesheets missing from {path}")
              path.write_text(source, encoding="utf-8")
          PY
      - name: Commit generated site
        run: |
          git config user.name kvb-builder-bot
          git config user.email kvb-builder-bot@users.noreply.github.com
          git add -A
          git commit -m "Auto-build: regenerate site [skip ci]" || echo "nothing to commit"
          git push origin "HEAD:$GITHUB_REF_NAME"
