<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">KVB ENTERPRISES project banner</title><desc id="desc">Animated 3D-inspired project banner for KVB ENTERPRISES.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080f1c"/><stop offset="1" stop-color="#15283a"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
<style>.float{transform-origin:900px 245px;animation:float 5s ease-in-out infinite}.glow{animation:pulse 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0px) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes pulse{0%,100%{opacity:.12}50%{opacity:.26}}text{font-family:Arial,Helvetica,sans-serif}</style>
<rect width="1200" height="480" rx="28" fill="url(#bg)"/><circle class="glow" cx="1020" cy="75" r="220" fill="#34d399" opacity=".16"/><circle class="glow" cx="1120" cy="450" r="180" fill="#fbbf24" opacity=".14"/><path d="M0 410 L420 480 L0 480 Z" fill="#34d399" opacity=".05"/><rect x="52" y="50" width="8" height="380" rx="4" fill="url(#accent)"/>
<text x="88" y="105" fill="#34d399" font-size="18" font-weight="700" letter-spacing="4">BUSINESS SERVICES · LIVE WEBSITE</text><text x="88" y="185" fill="#f8fafc" font-size="54" font-weight="700">KVB ENTERPRISES</text><text x="90" y="230" fill="#b9c8d8" font-size="22">Tax, registration &amp; compliance support</text><text x="90" y="300" fill="#71869b" font-size="15" letter-spacing="2">BUILT FOR REAL-WORLD WORKFLOWS</text><rect x="88" y="330" width="190" height="4" rx="2" fill="url(#accent)"/><text x="88" y="385" fill="#93a7bb" font-size="15">BERNARD VIVIAN  /  PROJECT PORTFOLIO</text><ellipse cx="900" cy="415" rx="205" ry="24" fill="#000" opacity=".35" filter="url(#shadow)"/><g><g class="float"><path d="M720 160 L910 90 L1080 155 L890 230 Z" fill="#24443b" stroke="#34d399"/><path d="M720 160 L890 230 L890 400 L720 330 Z" fill="#18342e"/><path d="M890 230 L1080 155 L1080 325 L890 400 Z" fill="#102720"/><g transform="translate(790 175) skewY(-18)"><rect width="230" height="160" rx="12" fill="#102c25" stroke="#4b8b70" stroke-width="2"/><text x="18" y="32" fill="#d1fae5" font-size="15" font-weight="700">BUSINESS DESK</text><rect x="15" y="48" width="200" height="26" rx="6" fill="#20463a"/><circle cx="29" cy="61" r="4" fill="#34d399"/><text x="42" y="66" fill="#e5f5ec" font-size="12">GST &amp; ITR</text><rect x="15" y="82" width="200" height="26" rx="6" fill="#20463a"/><circle cx="29" cy="95" r="4" fill="#60a5fa"/><text x="42" y="100" fill="#e5f5ec" font-size="12">Registration</text><rect x="15" y="116" width="200" height="26" rx="6" fill="#20463a"/><circle cx="29" cy="129" r="4" fill="#fbbf24"/><text x="42" y="134" fill="#e5f5ec" font-size="12">FSSAI &amp; compliance</text></g></g></g>
</svg>