<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GST Calculator | KVB ENTERPRISES</title></head><body style="font-family:system-ui;max-width:600px;margin:50px auto;padding:20px"><h1>GST Calculator</h1><label>Amount <input id="a" type="number" value="1000"></label><br><br><label>GST % <input id="r" type="number" value="18"></label><br><br><button onclick="c()">Calculate</button><div id="o" style="margin-top:20px;font-size:20px"></div><script>function c(){let a=+document.getElementById("a").value,r=+document.getElementById("r").value,g=a*r/100;document.getElementById("o").innerHTML=`GST: ₹${g.toFixed(2)}<br>Total: ₹${(a+g).toFixed(2)}`}</script></body></html>
