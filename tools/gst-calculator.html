<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="../assets/logo.png"><link rel="stylesheet" href="../style.css"><title>GST Calculator | KVB ENTERPRISES</title></head><body><header class="topbar"><div class="wrap nav"><a class="brand" href="../index.html"><img src="../assets/logo.png" alt="KVB ENTERPRISES logo"><span><b>KVB</b> ENTERPRISES<small>TAX & BUSINESS COMPLIANCE</small></span></a></div></header><main class="tool-page"><div class="wrap"><a class="back" href="../index.html#tools">← Free tools</a><h1>GST Calculator</h1><p>Quickly calculate GST amount and total value.</p><div class="calculator"><label>Amount (₹)<input id="amt" type="number" value="1000" min="0"></label><label>GST rate<select id="rate"><option>5</option><option>12</option><option selected>18</option><option>28</option></select>%</label><label>Calculation<select id="mode"><option value="exclusive">GST added to amount</option><option value="inclusive">Amount already includes GST</option></select></label><button class="btn primary wide" onclick="calc()">Calculate</button><div class="result" id="out">Enter values and calculate.</div></div></div></main><script>function calc(){const a=Number(document.getElementById('amt').value)||0,r=Number(document.getElementById('rate').value)/100,m=document.getElementById('mode').value;let base,gst,total;if(m==='exclusive'){base=a;gst=a*r;total=a+gst}else{total=a;base=a/(1+r);gst=total-base}document.getElementById('out').innerHTML=`Base Amount: ₹${base.toFixed(2)}<br>GST: ₹${gst.toFixed(2)}<br>Total: ₹${total.toFixed(2)}`}</script></body></html>
