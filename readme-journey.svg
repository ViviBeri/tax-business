<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="t d">
<title id="t">KVB ENTERPRISES service enquiry journey</title><desc id="d">Animated visual showing a visitor choosing a business service, reviewing the required information, sending an enquiry, and receiving human assistance. It does not imply government affiliation or automated filing.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b1b"/><stop offset=".6" stop-color="#102c31"/><stop offset="1" stop-color="#26301f"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#34d399"/><stop offset=".55" stop-color="#a3e635"/><stop offset="1" stop-color="#fbbf24"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.route{stroke-dasharray:14 10;animation:route 13s linear infinite}.tile{transform-box:fill-box;transform-origin:center;animation:float 5s ease-in-out infinite}.tile:nth-of-type(2){animation-delay:.6s}.tile:nth-of-type(3){animation-delay:1.2s}.tile:nth-of-type(4){animation-delay:1.8s}.tile:nth-of-type(5){animation-delay:2.4s}.shine{animation:shine 3.5s ease-in-out infinite}@keyframes route{to{stroke-dashoffset:-240}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes shine{0%,100%{opacity:.25}50%{opacity:.8}}@media(prefers-reduced-motion:reduce){.route,.tile,.shine{animation:none}}</style>
